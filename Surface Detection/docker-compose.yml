version: '3.8'

services:
  vesuvius-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vesuvius-surface-detection:latest
    container_name: vesuvius-dev
    
    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Volumes
    volumes:
      - ../data:/workspace/data
      - ../models:/workspace/models
      - ../logs:/workspace/logs
      - ../notebooks:/workspace/notebooks
      - ../configs:/workspace/configs
      - ../src:/workspace/src
      - ../scripts:/workspace/scripts
    
    # Environment variables
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - WANDB_API_KEY=${WANDB_API_KEY:-}
    
    # Ports
    ports:
      - "8888:8888"  # Jupyter
      - "6006:6006"  # TensorBoard
    
    # Working directory
    working_dir: /workspace
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Command
    command: /bin/bash

  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vesuvius-surface-detection:latest
    container_name: vesuvius-jupyter
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    volumes:
      - ../data:/workspace/data
      - ../models:/workspace/models
      - ../notebooks:/workspace/notebooks
      - ../src:/workspace/src
    
    ports:
      - "8888:8888"
    
    working_dir: /workspace
    
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''

  tensorboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vesuvius-surface-detection:latest
    container_name: vesuvius-tensorboard
    
    volumes:
      - ../logs:/workspace/logs
    
    ports:
      - "6006:6006"
    
    working_dir: /workspace
    
    command: tensorboard --logdir=logs --host=0.0.0.0 --port=6006
