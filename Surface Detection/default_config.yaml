# Default configuration for Vesuvius Surface Detection

# Data
train_data_dir: "data/processed/train"
val_data_dir: "data/processed/val"
test_data_dir: "data/raw/test"

# Model
model: "unet3d"  # Options: unet3d, resunet3d
base_channels: 32
depth: 4
trilinear: true

# Training
batch_size: 4
num_workers: 4
epochs: 100
patch_size: [128, 128, 128]
stride: [96, 96, 96]  # 32 voxel overlap

# Optimization
learning_rate: 0.0001
weight_decay: 0.00001
min_lr: 0.000001

# Loss
loss: "combined"  # Options: dice, bce, focal, combined, tversky

# Device
device: "cuda"  # Options: cuda, cpu

# Experiment tracking
use_wandb: false
experiment_name: "baseline_unet3d"

# Checkpointing
save_dir: "models"
save_every: 10

# Data augmentation
augmentation:
  random_flip: true
  random_rotation: true
  random_noise: false
  noise_std: 0.01

# Inference
inference:
  batch_size: 2
  patch_overlap: 32
  threshold: 0.5
